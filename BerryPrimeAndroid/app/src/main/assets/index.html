 <div class="kpi-grid">${kpi('sales','↗','Sales collected',fm(ms.payments),'Invoice payments · '+monthLabel)}${kpi('income','＋','Other income',fm(ms.otherIncome),'Additional income · '+monthLabel)}${kpi('income','∑','Total income',fm(ms.income),'Sales + other income')}${kpi('expense','−','Total expenses',fm(ms.expenses),'Recorded expenses')}${kpi('profit','◆',ms.profit>=0?'Net profit':'Net loss',fm(Math.abs(ms.profit)),ms.profit>=0?'Positive monthly result':'Monthly expenses exceed income')}${kpi('outstanding','◷','Outstanding invoices',fm(out),'Unpaid invoice balances · all time')}${kpi('neutral','▤','Invoiced this month',fm(ms.invoiced),'Invoices issued · '+monthLabel)}${kpi('neutral','◎','Upcoming events',String(up),'Scheduled photography events')}</div>
 <div class="dash-section"><div><h3>Monthly cash flow</h3><small>Income compared with expenses · latest recorded months</small></div><div class="dash-legend"><span><i></i>Income</span><span><i class="exp"></i>Expenses</span></div></div><div class="dash-panel">${chart}</div>
 <div class="dash-two"><div class="dash-panel dash-table"><div class="dash-panel-head"><div><b>Monthly profit & loss</b><br><small>Month-by-month financial summary</small></div><button class="g" onclick="go('Income & Expenses')">Manage transactions →</button></div><div class="tw"><table><tr><th>Month</th><th>Total income</th><th>Expenses</th><th>Profit / (Loss)</th></tr>${months.map(k=>{const x=monthStats(k);return `<tr><td><b>${MN[+(k.slice(5,7))-1]} ${k.slice(0,4)}</b></td><td>${fm(x.income)}</td><td>${fm(x.expenses)}</td><td style="font-weight:800;color:${x.profit>=0?'var(--ok)':'var(--bad)'}">${x.profit<0?'('+fm(-x.profit)+')':fm(x.profit)}</td></tr>`}).join('')||'<tr><td colspan="4" style="color:var(--mu)">No financial transactions recorded yet.</td></tr>'}</table></div></div>
 <div class="dash-panel"><div class="dash-panel-head"><div><b>All-time overview</b><br><small>From the beginning of your records</small></div></div><div class="kpi-grid" style="grid-template-columns:1fr 1fr">${kpi('income','＋','Total income',fm(as.income),'Lifetime')}${kpi('expense','−','Total expenses',fm(as.expenses),'Lifetime')}${kpi('profit','◆',as.profit>=0?'Net profit':'Net loss',fm(Math.abs(as.profit)),'Lifetime result')}${kpi('neutral','▤','Total invoiced',fm(allInv),'Lifetime')}</div></div></div>
 <div class="dash-two"><div class="dash-panel"><div class="dash-panel-head"><div><b>Today at a glance</b><br><small>Daily sales activity</small></div></div><div class="kpi-grid" style="grid-template-columns:1fr 1fr">${kpi('neutral','▤','Invoiced today',fm(ti.reduce((s,i)=>s+(+i.total||0),0)),ti.length+' invoice(s) issued')}${kpi('sales','↗','Collected today',fm(tp.reduce((s,p)=>s+(+p.amt||0),0)),tp.length+' payment(s) received')}</div></div>
 <div class="dash-panel"><div class="dash-panel-head"><div><b>Quick actions</b><br><small>Common tasks</small></div></div><div class="dash-quick"><button onclick="go('Invoices')">▤ View invoices<span>Search and manage billing</span></button><button onclick="go('Payments')">↗ Record payment<span>Update customer balances</span></button><button onclick="go('Reports')">▥ Open reports<span>Review business reports</span></button><button onclick="go('Packages')">◇ Manage packages<span>Update photography services</span></button></div></div></div>
 ${calHTML()}<div class="dash-panel dash-table"><div class="dash-panel-head"><div><b>Recent invoices</b><br><small>Latest customer billing activity</small></div><button class="b" onclick="newInv()">＋ New invoice</button></div>${invTable(D.invoices.slice(0,8))}</div>`;
}
let calY=new Date().getFullYear(),calM=new Date().getMonth();
const pad=n=>String(n).padStart(2,'0'),MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
function calNav(d){calM+=d;if(calM<0){calM=11;calY--}if(calM>11){calM=0;calY++}dash()}
function calHTML(){const first=new Date(calY,calM,1).getDay(),days=new Date(calY,calM+1,0).getDate(),t=today();let cells='';
for(let i=0;i<first;i++)cells+='<div style="min-height:64px"></div>';
for(let d=1;d<=days;d++){const ds=`${calY}-${pad(calM+1)}-${pad(d)}`,ev=D.events.filter(e=>e.date===ds).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
cells+=`<div onclick="evForm(null,'${ds}')" style="min-height:64px;border:1px solid ${ds===t?'var(--ac)':'var(--bd)'};border-radius:8px;padding:3px;cursor:pointer;overflow:hidden;background:${ds===t?'var(--in)':'transparent'}"><div style="font-size:11px;font-weight:700;color:${ds===t?'var(--ac)':'var(--mu)'}">${d}</div>${ev.slice(0,2).map(e=>`<div onclick="event.stopPropagation();evForm('${e.id}')" style="background:var(--ac);color:#fff;border-radius:4px;font-size:10px;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(e.time||'')} ${esc(e.title)}</div>`).join('')}${ev.length>2?`<div style="font-size:10px;color:var(--mu)">+${ev.length-2} more</div>`:''}</div>`}
const up=D.events.filter(e=>e.date>=t).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))).slice(0,6);
return `<div class="card"><div class="h"><b>📅 Event Calendar</b><span style="display:flex;gap:6px;align-items:center"><button class="g" onclick="calNav(-1)">‹</button><b style="min-width:120px;text-align:center">${MN[calM]} ${calY}</b><button class="g" onclick="calNav(1)">›</button><button class="g" onclick="sendCal()">📤 Send</button><button class="b" onclick="evForm()">+ Add event</button></span></div>
<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:11px;font-weight:700;color:var(--mu);margin-bottom:3px">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div>${x}</div>`).join('')}</div>
<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">${cells}</div>
<div style="margin-top:12px"><b>Upcoming events</b>${up.map(e=>`<div class="h" style="margin:6px 0 0;border-bottom:1px solid var(--bd);padding-bottom:6px"><span><b>${esc(e.title)}</b><br><span style="color:var(--mu);font-size:12px">${e.date} ${esc(e.time||'')} ${e.pkg?'· '+esc(e.pkg):''} ${e.loc?'· 📍'+esc(e.loc):''}</span></span><button class="g" onclick="evForm('${e.id}')">Open</button></div>`).join('')||'<div style="color:var(--mu);margin-top:6px">No upcoming events. Tap a day to add one.</div>'}</div></div>`}
function evForm(id,date){const e=D.events.find(x=>x.id===id)||{title:'',date:date||today(),time:'',loc:'',pkg:'',note:''};
open_(`<h3>${id?'Edit':'Add'} event</h3><div class="row"><div><label>Event / client name</label><input id="e1" value="${esc(e.title)}" placeholder="e.g. Asha & John Wedding"></div><div><label>Package</label><select id="e5"><option value="">— none —</option>${D.products.map(p=>`<option ${e.pkg===p.name?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div></div>
<div class="row"><div><label>Date</label><input id="e2" type="date" value="${e.date}"></div><div><label>Time</label><input id="e3" type="time" value="${e.time||''}"></div><div><label>Location</label><input id="e4" value="${esc(e.loc||'')}"></div></div>
<div class="row"><div><label>Notes</label><textarea id="e6" rows="3">${esc(e.note||'')}</textarea></div></div>
<div class="h"><button class="g" onclick="close_()">Cancel</button><span>${id?`<button class="g" onclick="delEv('${id}')">Delete</button> `:''}<button class="b" onclick="saveEv('${id||''}')">Save</button></span></div>`)}
function saveEv(id){const d={title:$('#e1').value.trim(),date:$('#e2').value,time:$('#e3').value,loc:$('#e4').value.trim(),pkg:$('#e5').value,note:$('#e6').value.trim()};if(!d.title||!d.date)return toast('Name and date required');if(id)Object.assign(D.events.find(x=>x.id===id),d);else D.events.push({id:'E'+Date.now(),...d});save();close_();const dt=new Date(d.date+'T00:00');calY=dt.getFullYear();calM=dt.getMonth();render();toast('Event saved')}
function delEv(id){if(confirm('Delete this event?')){D.events=D.events.filter(x=>x.id!==id);save();close_();render()}}
function invTable(l){return `<div class="tw"><table><tr><th>No</th><th>Date</th><th>Customer</th><th>Total</th><th>Paid</th><th>Status</th><th></th></tr>${l.map(i=>`<tr><td><b>${i.no}</b></td><td>${i.date}</td><td>${esc(i.cust)}</td><td>${fm(i.total)}</td><td>${fm(paidOf(i))}</td><td><span class="pill ${st(i)}">${st(i)}</span></td><td class="r"><button class="g" onclick="viewInv('${i.id}')">Open</button> ${rm('delInv',i.id)}</td></tr>`).join('')||'<tr><td colspan=7 style="color:var(--mu)">No invoices yet.</td></tr>'}</table></div>`}
function invs(){$('#app').innerHTML=`<div class="card"><div class="h"><input id="q" placeholder="Search invoice or customer" oninput="fi()" style="max-width:280px"><button class="b" onclick="newInv()">+ New invoice</button></div><div id="il">${invTable(D.invoices)}</div></div>`}
function fi(){const q=$('#q').value.toLowerCase();$('#il').innerHTML=invTable(D.invoices.filter(i=>(i.no+i.cust).toLowerCase().includes(q)))}
function newInv(){cart=[];const d=new Date();d.setDate(d.getDate()+14);
open_(`<h3>New invoice</h3><div class="row"><div><label>Customer</label><input id="c1" value="Walk-in Customer"></div><div><label>Phone</label><input id="c2"></div><div><label>Due date</label><input id="c3" type="date" value="${d.toISOString().slice(0,10)}"></div></div>
<div class="row"><div><label>Add package</label><select id="sp">${D.products.map(p=>`<option value="${p.id}">${esc(p.name)} – ${fm(p.price)}</option>`).join('')}</select></div><div style="align-self:end"><button class="g" onclick="addL()">Add line</button></div></div>
<div id="cl"></div><div class="row"><div><label>Discount (TSh)</label><input id="ds" type="number" value="0" oninput="cl_()"></div><div><label>Notes</label><input id="nt"></div></div>
<div class="h"><b id="ct">Total: TSh 0</b><span><button class="g" onclick="close_()">Cancel</button> <button class="b" onclick="saveInv()">Issue invoice</button></span></div>`)}
function addL(){const p=D.products.find(x=>x.id===$('#sp').value);const l=cart.find(x=>x.pid===p.id);if(l){l.qty++}else{cart.push({pid:p.id,name:p.name,desc:p.desc||'',qty:1,price:p.price})}cl_()}
function cl_(){const sub=cart.reduce((s,l)=>s+l.qty*l.price,0);$('#cl').innerHTML=`<div class="tw"><table><tr><th>Item</th><th>Qty</th><th>Price</th><th>Line</th><th></th></tr>${cart.map((l,i)=>`<tr><td>${esc(l.name)}<div style="font-size:11px;color:var(--mu);white-space:normal;max-width:320px">${esc(l.desc||'')}</div></td><td><input type="number" min="1" value="${l.qty}" style="width:70px" onchange="cart[${i}].qty=Math.max(1,+this.value);cl_()"></td><td><input type="number" value="${l.price}" style="width:110px" onchange="cart[${i}].price=+this.value;cl_()"></td><td>${fm(l.qty*l.price)}</td><td><button class="g" onclick="cart.splice(${i},1);cl_()">×</button></td></tr>`).join('')}</table></div>`;$('#ct').textContent='Total: '+fm(Math.max(0,sub-(+$('#ds').value||0)))}
function saveInv(){if(!cart.length)return toast('Add at least one item');const sub=cart.reduce((s,l)=>s+l.qty*l.price,0),ds=+$('#ds').value||0;
const i={id:'I'+Date.now(),no:'BPV-INV-'+(++D.seq.inv),date:today(),due:$('#c3').value,cust:$('#c1').value||'Walk-in Customer',phone:$('#c2').value,items:cart.map(l=>({...l})),disc:ds,total:Math.max(0,sub-ds),note:$('#nt').value};
D.invoices.unshift(i);save();close_();toast('Invoice '+i.no+' issued');render();viewInv(i.id)}
function docHead(title,no){const s=D.set,pos=s.lpos||'center',sz=({small:45,medium:70,large:100})[s.lsize||'medium'];const img=s.logo&&pos!=='hidden'?`<img src="${s.logo}" alt="logo" style="max-height:${sz}px;max-width:${sz*3}px;display:block;${pos==='center'?'margin:0 auto 8px':'flex:none'}">`:'';
const txt=`<div style="font-size:20px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase">${esc(s.name)}</div><div style="margin-top:3px">${esc(s.addr)}</div><div>Tel: ${esc(s.tel)} &nbsp;|&nbsp; TIN: ${esc(s.tin)}</div>`;
const top=(pos==='left'||pos==='right')&&img?`<div style="display:flex;align-items:center;gap:14px;${pos==='right'?'flex-direction:row-reverse;':''}">${img}<div style="flex:1;text-align:center">${txt}</div></div>`:`<div style="text-align:center">${img}${txt}</div>`;
return `${top}<div style="border-top:3px double #111;margin:12px 0 10px"></div><div style="text-align:center;margin-bottom:12px"><div style="font-size:19px;font-weight:800;letter-spacing:3px">${title}</div><div style="display:inline-block;margin-top:5px;padding:3px 14px;border:1px solid #111;border-radius:99px;font-weight:700;font-size:12px">No: ${no}</div></div>`}
function metaBox(l,r){return `<div style="display:grid;grid-template-columns:1fr 1fr;border:1px solid #ccc;border-radius:6px;margin-bottom:12px"><div style="padding:8px 10px;border-right:1px solid #ccc;line-height:1.6">${l}</div><div style="padding:8px 10px;line-height:1.6">${r}</div></div>`}
function itemsTbl(i){const th='background:#111;color:#fff;padding:7px 8px;font-size:11px;text-transform:uppercase;border:0';return `<table style="width:100%;border-collapse:collapse;margin-bottom:8px"><tr><th style="${th};text-align:left">Package / Service</th><th style="${th};text-align:center;width:44px">Qty</th><th style="${th};text-align:right">Price</th><th style="${th};text-align:right">Total</th></tr>${i.items.map(l=>`<tr><td style="white-space:normal;padding:8px;border-bottom:1px solid #ddd"><b>${esc(l.name)}</b><div style="font-size:10px;color:#555;margin-top:2px">${esc(l.desc||'')}</div></td><td style="text-align:center;padding:8px;border-bottom:1px solid #ddd">${l.qty}</td><td style="text-align:right;padding:8px;border-bottom:1px solid #ddd">${l.price.toLocaleString()}</td><td style="text-align:right;padding:8px;border-bottom:1px solid #ddd">${(l.qty*l.price).toLocaleString()}</td></tr>`).join('')}</table>`}
function totRows(rows){return `<div style="margin-left:auto;width:max(55%,230px);margin-bottom:12px">${rows.map(r=>`<div style="display:flex;justify-content:space-between;gap:12px;padding:5px 8px;${r[2]?'background:#111;color:#fff;font-weight:800;border-radius:4px;margin-top:3px':'border-bottom:1px solid #eee'}"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('')}</div>`}
const qrHTML=()=>D.set.qr?`<div style="text-align:center;margin:6px 0 12px"><img src="${D.set.qr}" alt="QR code" style="width:${({small:80,medium:110,large:150})[D.set.qrsize||'medium']}px;height:auto;display:block;margin:0 auto">${(D.set.qrcap??'Scan to pay')?`<div style="font-size:11px;font-weight:700;margin-top:3px">${esc(D.set.qrcap??'Scan to pay')}</div>`:''}</div>`:'';
const footHTML=()=>`<div style="text-align:center;border-top:1px solid #ccc;padding-top:10px;margin-top:6px"><div style="font-weight:700">${esc(D.set.foot)}</div></div>`;
function invHTML(i){const p=paidOf(i),bal=i.total-p;
return `<div class="doc" style="padding:20px">${docHead('INVOICE',i.no)}${metaBox(`<b style="font-size:11px;color:#555">BILL TO</b><br><b>${esc(i.cust)}</b>${i.phone?'<br>'+esc(i.phone):''}`,`<b style="font-size:11px;color:#555">DETAILS</b><br>Date: <b>${i.date}</b><br>Due: <b>${i.due||'-'}</b>`)}${itemsTbl(i)}${totRows([['Subtotal',fm(i.total+i.disc)],['Discount','- '+fm(i.disc)],['Invoice total',fm(i.total)],['Paid',fm(p)],['Balance due',fm(bal),1]])}${D.set.pay?`<div style="text-align:center;border:1px dashed #999;border-radius:6px;padding:8px;margin-bottom:10px"><b style="font-size:11px;color:#555">PAYMENT INSTRUCTIONS</b><br>${esc(D.set.pay)}</div>`:''}${i.note?`<div style="text-align:center;font-size:11px;margin-bottom:8px">Note: ${esc(i.note)}</div>`:''}${qrHTML()}${footHTML()}</div>`}
let docName='';
const docFn=(c,t,n)=>((String(c||'Customer').replace(/[\\/:*?"<>|]+/g,'').trim().replace(/\s+/g,'_'))||'Customer')+'_'+t+'_'+n;
function viewInv(id){const i=inv(id);docName=docFn(i.cust,'Invoice',i.no);const p=paidOf(i),bal=i.total-p,pm=D.payments.filter(x=>x.inv===id);
open_(invHTML(i)+`
${pm.length?`<p><b>Payments</b></p>`+pm.map(x=>`<div class="h"><span>${x.rc} · ${x.date} · ${x.method} · ${fm(x.amt)}</span><span><button class="g" onclick="rcpt('${x.id}')">Receipt</button> ${rm('delPay',x.id)}</span></div>`).join(''):''}
<div class="h" style="margin-top:10px"><span><button class="g" onclick="close_()">Close</button> <button class="g" onclick="pr('inv','${id}')">Print</button> <button class="g" onclick="dl('pdf','${i.no}')">PDF</button> <button class="g" onclick="dl('png','${i.no}')">Image</button> ${rm('delInv',id,'Remove invoice')}</span>${bal>0?`<button class="b" onclick="payForm('${id}')">Record payment</button>`:'<span class="pill Paid">Fully paid</span>'}</div>`)}
function activeMethods(){return (D.set.paymentMethods||[]).filter(x=>x.active).map(x=>x.name)}
function methodOptions(selected){const a=activeMethods();if(selected&&!a.includes(selected))a.unshift(selected);return a.map(m=>`<option value="${esc(m)}" ${selected===m?'selected':''}>${esc(m)}</option>`).join('')}
function payForm(id){const i=inv(id),bal=i.total-paidOf(i);open_(`<h3>Record payment – ${i.no}</h3><p>Balance: <b>${fm(bal)}</b></p><div class="row"><div><label>Amount (TSh)</label><input id="pa" type="number" value="${bal}"></div><div><label>Method</label><select id="pm">${methodOptions(activeMethods()[0]||'')}</select></div><div><label>Reference / Txn ID</label><input id="pr"></div></div><div class="h"><button class="g" onclick="viewInv('${id}')">Back</button><button class="b" onclick="savePay('${id}')">Confirm & issue receipt</button></div>`)}
function savePay(id){const i=inv(id),a=Math.round(+$('#pa').value),bal=i.total-paidOf(i);if(!(a>0))return toast('Enter amount');if(a>bal)return toast('Amount exceeds balance');
const p={id:'R'+Date.now(),rc:'BPV-RCT-'+(++D.seq.rc),inv:id,date:today(),time:new Date().toTimeString().slice(0,5),amt:a,method:$('#pm').value,ref:$('#pr').value};D.payments.unshift(p);save();toast('Payment recorded');render();rcpt(p.id)}
function rcptHTML(p){const i=inv(p.inv);const after=i.total-D.payments.filter(x=>x.inv===i.id&&x.id<=p.id).reduce((s,x)=>s+x.amt,0);
return `<div class="doc" style="padding:20px">${docHead('PAYMENT RECEIPT',p.rc)}${metaBox(`<b style="font-size:11px;color:#555">RECEIVED FROM</b><br><b>${esc(i.cust)}</b>${i.phone?'<br>'+esc(i.phone):''}`,`<b style="font-size:11px;color:#555">DETAILS</b><br>Date: <b>${p.date} ${p.time}</b><br>Invoice: <b>${i.no}</b>`)}${metaBox(`Payment method:<br><b>${esc(p.method)}</b>`,`Reference / Txn ID:<br><b>${esc(p.ref)||'-'}</b>`)}${itemsTbl(i)}<div style="text-align:center;border:2px solid #111;border-radius:8px;padding:10px;margin:6px 0 12px"><div style="font-size:11px;color:#555;letter-spacing:2px;font-weight:700">AMOUNT RECEIVED</div><div style="font-size:24px;font-weight:800">${fm(p.amt)}</div><div style="margin-top:4px">Invoice total: ${fm(i.total)} &nbsp;|&nbsp; Balance after payment: <b>${fm(after)}</b></div></div>${qrHTML()}${footHTML()}</div>`}
function rcpt(id){const p=D.payments.find(x=>x.id===id);docName=docFn((inv(p.inv)||{}).cust,'Receipt',p.rc);open_(rcptHTML(p)+`<div class="h" style="margin-top:10px"><button class="g" onclick="close_()">Close</button><span><button class="g" onclick="dl('pdf','${p.rc}')">PDF</button> <button class="g" onclick="dl('png','${p.rc}')">Image</button> ${rm('delPay',id)} <button class="b" onclick="pr('rc','${id}')">Print</button></span></div>`)}
function pr(t,id){$('#print').innerHTML=t==='rc'?rcptHTML(D.payments.find(x=>x.id===id)):invHTML(inv(id));try{window.print()}catch(e){toast('Printing is not available here')}}
function pays(){$('#app').innerHTML=`<div class="card"><b>Payments & receipts</b><div class="tw"><table><tr><th>Receipt</th><th>Date</th><th>Invoice</th><th>Customer</th><th>Method</th><th>Amount</th><th></th></tr>${D.payments.map(p=>{const i=inv(p.inv)||{no:'?',cust:'?'};return `<tr><td><b>${p.rc}</b></td><td>${p.date}</td><td>${i.no}</td><td>${esc(i.cust)}</td><td>${p.method}</td><td>${fm(p.amt)}</td><td class="r"><button class="g" onclick="rcpt('${p.id}')">Open</button> ${rm('delPay',p.id)}</td></tr>`}).join('')||'<tr><td colspan=7 style="color:var(--mu)">No payments yet.</td></tr>'}</table></div></div>`}
function financeForm(type,id){const list=type==='income'?D.incomes:D.expenses,old=list.find(x=>x.id===id)||{date:today(),category:type==='income'?'Other income':'Operating expense',description:'',amount:'',method:activeMethods()[0]||'',ref:'',person:'',activity:''};

function saveFinance(type,id){const amount=+$('#fxamt').value;if(!(amount>0))return toast('Enter a valid amount');const d={id:id||'F'+Date.now(),date:$('#fxdate').value,category:$('#fxcat').value.trim()||(type==='income'?'Other income':'Operating expense'),description:$('#fxdesc').value.trim(),amount,method:$('#fxmethod').value,ref:$('#fxref').value.trim(),person:type==='income'?($('#fxperson')?.value.trim()||''):'',activity:type==='income'?($('#fxactivity')?.value.trim()||''):''};if(!d.date)return toast('Select transaction date');const a=type==='income'?D.incomes:D.expenses;if(id){const x=a.find(z=>z.id===id);if(x)Object.assign(x,d)}else a.unshift(d);save();close_();finances();toast((type==='income'?'Income':'Expense')+' saved')}

<div class="row"><div><label>Text under QR code</label><input value="${esc(s.qrcap??'Scan to pay')}" onchange="D.set.qrcap=this.value;save()"></div><div><label>QR size</label><select onchange="D.set.qrsize=this.value;save()">${[['small','Small'],['medium','Medium'],['large','Large']].map(o=>`<option value="${o[0]}" ${(s.qrsize||'medium')===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div></div></div>
<div class="card"><b>Cloud backup & sync (Firebase Realtime Database)</b><p style="color:var(--mu);margin:6px 0 12px">Your records are saved on this phone automatically. Configure your own Firebase project to back up or restore records online. Cloud sync is manual and requires an internet connection.</p><div class="row"><div><label>Firebase Web API key</label><input id="cloudApiKey" autocomplete="off" placeholder="Firebase project API key"></div><div><label>Realtime Database URL</label><input id="cloudDbUrl" placeholder="https://your-project-default-rtdb.firebaseio.com"></div></div><div class="row"><div><label>Firebase account email</label><input id="cloudEmail" type="email" autocomplete="username" placeholder="Your Firebase login email"></div><div><label>Firebase account password</label><input id="cloudPassword" type="password" autocomplete="current-password" placeholder="Enter for each sync; not saved"></div></div><div class="h"><button class="g" onclick="saveCloudConfig()">Save cloud settings</button><button class="b" onclick="syncCloud()">Back up this phone to cloud</button><button class="g" onclick="restoreCloud()">Restore from cloud</button></div><p id="cloudStatus" style="color:var(--mu);font-size:12px;margin:6px 0 0">Cloud sync is not configured.</p></div>

function cloudConfig(){try{return JSON.parse(localStorage.getItem(CLOUD_KEY)||'{}')}catch(e){return {}}}
function saveCloudConfig(){const c={apiKey:$('#cloudApiKey').value.trim(),dbUrl:$('#cloudDbUrl').value.trim().replace(/\/$/,''),email:$('#cloudEmail').value.trim()};if(!c.apiKey||!c.dbUrl||!c.email)return toast('Enter Firebase API key, database URL and email');localStorage.setItem(CLOUD_KEY,JSON.stringify(c));$('#cloudStatus').textContent='Cloud settings saved on this phone. Enter your password when syncing.';toast('Cloud settings saved')}
async function firebaseLogin(c,password){const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+encodeURIComponent(c.apiKey),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:c.email,password,returnSecureToken:true})});const j=await r.json();if(!r.ok)throw new Error(j.error?.message||'Firebase sign-in failed');return j}
async function syncCloud(){const c=cloudConfig(),pw=$('#cloudPassword')?.value||'';if(!c.apiKey||!c.dbUrl||!c.email)return toast('Save Firebase cloud settings first');if(!pw)return toast('Enter your Firebase account password');try{$('#cloudStatus').textContent='Signing in and backing up…';const a=await firebaseLogin(c,pw);const url=c.dbUrl+'/users/'+encodeURIComponent(a.localId)+'/berryPrimeVissual.json?auth='+encodeURIComponent(a.idToken);const r=await fetch(url,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(D)});if(!r.ok)throw new Error('Cloud backup failed ('+r.status+')');$('#cloudStatus').textContent='✓ Cloud backup completed: '+new Date().toLocaleString();$('#cloudPassword').value='';toast('Cloud backup completed')}catch(e){$('#cloudStatus').textContent='Cloud sync error: '+e.message;toast('Cloud sync failed: '+e.message)}}
async function restoreCloud(){const c=cloudConfig(),pw=$('#cloudPassword')?.value||'';if(!c.apiKey||!c.dbUrl||!c.email)return toast('Save Firebase cloud settings first');if(!pw)return toast('Enter your Firebase account password');if(!confirm('Restore cloud data to this phone? The current local business data will be replaced. Back up this phone first if needed.'))return;try{$('#cloudStatus').textContent='Signing in and retrieving cloud data…';const a=await firebaseLogin(c,pw);const url=c.dbUrl+'/users/'+encodeURIComponent(a.localId)+'/berryPrimeVissual.json?auth='+encodeURIComponent(a.idToken);const r=await fetch(url);if(!r.ok)throw new Error('Cloud restore failed ('+r.status+')');const data=await r.json();if(!data||!data.seq||!Array.isArray(data.invoices))throw new Error('No valid Berry Prime backup was found for this account');D=data;D.events=D.events||[];D.incomes=D.incomes||[];D.expenses=D.expenses||[];D.set=D.set||{};D.set.paymentMethods=D.set.paymentMethods||['Cash','M-Pesa','Airtel Money','Tigo Pesa','Bank Transfer','Card','Other'].map(name=>({name,active:true}));D.set.paymentMethods=D.set.paymentMethods.map(x=>typeof x==='string'?{name:x,active:true}:x);save();render();$('#cloudPassword').value='';$('#cloudStatus').textContent='✓ Cloud data restored: '+new Date().toLocaleString();toast('Cloud data restored')}catch(e){$('#cloudStatus').textContent='Cloud restore error: '+e.message;toast('Cloud restore failed: '+e.message)}}
function importBackup(inp){const f=inp.files&&inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const doc=new DOMParser().parseFromString(String(rd.result),'text/html'),node=doc.getElementById('bpv-data');if(!node)throw new Error('This file is not a Berry Prime backup');const data=JSON.parse(node.textContent||'null');if(!data||!data.seq||!Array.isArray(data.invoices))throw new Error('The selected HTML file does not contain saved business records. In the old app, choose Settings → Save copy with data first.');if(!confirm('Import '+data.invoices.length+' invoice(s), '+(data.payments||[]).length+' payment(s), and related records? Current phone data will be replaced.'))return;D=data;D.events=D.events||[];D.incomes=D.incomes||[];D.expenses=D.expenses||[];D.set=D.set||{};D.set.paymentMethods=D.set.paymentMethods||['Cash','M-Pesa','Airtel Money','Tigo Pesa','Bank Transfer','Card','Other'].map(name=>({name,active:true}));D.set.paymentMethods=D.set.paymentMethods.map(x=>typeof x==='string'?{name:x,active:true}:x);save();render();toast('Business backup imported successfully')}catch(e){toast(e.message||'Could not import backup')}finally{inp.value=''}};rd.readAsText(f)}

function upQR(inp){const f=inp.files[0];if(!f)return;const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,500/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);D.set.qr=c.toDataURL('image/png');URL.revokeObjectURL(u);save();toast('QR code saved');sets()};im.onerror=()=>toast('Could not read image');im.src=u}
function upLogo(inp){const f=inp.files[0];if(!f)return;const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);D.set.logo=c.toDataURL('image/png');URL.revokeObjectURL(u);save();toast('Logo saved');sets()};im.onerror=()=>toast('Could not read image');im.src=u}
async function dl(kind,name){name=docName||name;const el=$('#mc .doc');if(!el)return;if(!window.html2canvas||!window.jspdf)return toast('Export library failed to load');
try{toast('Preparing '+kind.toUpperCase()+'...');const cv=await html2canvas(el,{scale:2,backgroundColor:'#ffffff'});let blob;
if(kind==='png')blob=await new Promise(r=>cv.toBlob(r,'image/png'));
else{const pdf=new jspdf.jsPDF({unit:'pt',format:'a4'}),W=pdf.internal.pageSize.getWidth()-60,H=pdf.internal.pageSize.getHeight()-60;let w=W,h=cv.height*W/cv.width;if(h>H){w=W*H/h;h=H}pdf.addImage(cv.toDataURL('image/jpeg',.95),'JPEG',(pdf.internal.pageSize.getWidth()-w)/2,30,w,h);blob=pdf.output('blob')}
if(await saveBlob(name+(kind==='png'?'.png':'.pdf'),blob))toast('Saved '+name)}catch(e){if(e&&e.code==='declined')return;toast('Download failed')}}
/* ---- monthly calendar: send / .ics / 20:00 reminder ---- */
function monthText(){const pre=calY+'-'+pad(calM+1);const ev=D.events.filter(e=>e.date.startsWith(pre)).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
 return '📅 '+D.set.name+' – Events '+MN[calM]+' '+calY+'\n\n'+(ev.map(e=>e.date.slice(8)+'/'+e.date.slice(5,7)+' '+(e.time||'')+' – '+e.title+(e.pkg?' ('+e.pkg+')':'')+(e.loc?' @ '+e.loc:'')).join('\n')||'No events this month.')}
function sendCal(){const t=monthText();open_(`<h3>Send event calendar</h3><pre style="white-space:pre-wrap;background:var(--in);padding:10px;border-radius:8px;max-height:40vh;overflow:auto;font:inherit">${esc(t)}</pre><div class="row" style="margin-top:10px"><div><label>Send to phone number (WhatsApp / SMS)</label><input id="calph" value="${esc(calPh())}" onchange="D.set.calPhone=this.value.trim();save()"></div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="b" onclick="D.set.calPhone=$('#calph').value.trim();save();calWA()">WhatsApp</button><button class="g" onclick="D.set.calPhone=$('#calph').value.trim();save();calSMS()">SMS</button><button class="g" onclick="calEmail()">Email</button><button class="g" onclick="calShare()">Share…</button><button class="g" onclick="calCopy()">Copy</button><button class="g" onclick="exportICS()">Download .ics</button></div><label style="margin-top:12px;display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto" ${D.set.remind!==false?'checked':''} onchange="D.set.remind=this.checked;save()"> Remind me every day at 20:00 (while this page is open)</label><div class="h" style="margin-top:10px"><button class="g" onclick="close_()">Close</button></div>`)}
const calEmail=()=>{location.href='mailto:?subject='+encodeURIComponent('Event calendar – '+MN[calM]+' '+calY)+'&body='+encodeURIComponent(monthText())};
const calPh=()=>(D.set.calPhone||'+255628339487');
const calWA=()=>window.open('https://wa.me/'+calPh().replace(/\D/g,'')+'?text='+encodeURIComponent(monthText()),'_blank');
const calSMS=()=>{location.href='sms:'+calPh().replace(/[^\d+]/g,'')+'?body='+encodeURIComponent(monthText())};
async function calCopy(){try{await navigator.clipboard.writeText(monthText());toast('Copied')}catch(e){toast('Copy failed')}}
async function calShare(){try{if(navigator.share)await navigator.share({title:'Event calendar',text:monthText()});else calCopy()}catch(e){}}
function exportICS(){const z=x=>String(x||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'),st=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
 const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Berry Prime//Billing//EN'];
 D.events.forEach(e=>{const d=e.date.replace(/-/g,'');L.push('BEGIN:VEVENT','UID:'+e.id+'@berryprime','DTSTAMP:'+st,'SUMMARY:'+z(e.title));
  if(e.time){L.push('DTSTART:'+d+'T'+e.time.replace(':','')+'00','DURATION:PT2H')}else L.push('DTSTART;VALUE=DATE:'+d);
  if(e.loc)L.push('LOCATION:'+z(e.loc));if(e.pkg||e.note)L.push('DESCRIPTION:'+z([e.pkg,e.note].filter(Boolean).join(' – ')));
  L.push('BEGIN:VALARM','TRIGGER:-PT1H','ACTION:DISPLAY','DESCRIPTION:Event reminder','END:VALARM','END:VEVENT')});
 L.push('END:VCALENDAR');saveBlob('Berry_Prime_Events.ics',new Blob([L.join('\r\n')],{type:'text/calendar'})).then(ok=>ok&&toast('Calendar file saved – open it to add events to your phone/Google calendar'))}
function remCheck(){const n=new Date(),k=n.toDateString();if(D.set.remind===false||D.set.lastRem===k||n.getHours()<20||$('#m').classList.contains('on'))return;D.set.lastRem=k;save();sendCal()}
$('#m').addEventListener('click',e=>{if(e.target.id==='m')close_()});render();setInterval(remCheck,30000);remCheck();
</script></body></html>
